name: TTS health

# Surveillance de la dépendance externe Edge TTS.
#
# Volontairement SÉPARÉ de `ci.yml` : la CI de pull request doit rester
# déterministe et hors ligne. Un incident réseau chez Microsoft ne doit pas
# rendre une PR rouge — sinon l'alerte finit par être ignorée, ce qui est
# précisément le mode de défaillance que cette sonde doit éviter.

on:
  schedule:
    # Toutes les 6 heures (UTC) — la panne de jetons v1→v2 est restée invisible
    # plusieurs jours ; 4 contrôles/jour gardent la détection sous 6 heures.
    #
    # Décalé de 17 min : GitHub signale que la charge est maximale au début de
    # chaque heure et que « some queued jobs may be dropped ». Pour une sonde,
    # un job abandonné n'est pas un retard mais un TROU SILENCIEUX dans la
    # couverture — exactement ce que ce système doit éliminer.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Forcer l'échec de la sonde (validation du chemin d'alerte)."
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sonder le moteur TTS en production
        id: probe
        run: npm run check:tts
        continue-on-error: true

      # Le chemin d'alerte n'était exerçable qu'en cas de panne réelle, donc
      # jamais testé. Cette entrée permet de l'exercer à la demande : c'est le
      # seul moyen de vérifier qu'une alerte arrivera vraiment le jour J.
      - name: Forcer l'état dégradé (simulation)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "::warning::Simulation demandée : le chemin d'alerte va être exercé."
          echo "SIMULATED_FAILURE=1" >> "$GITHUB_ENV"

      - name: Préparer le corps de l'alerte
        if: steps.probe.outcome == 'failure' || env.SIMULATED_FAILURE == '1'
        run: |
          cat > /tmp/tts-alert-body.md <<'EOF'
          La sonde `npm run check:tts` a échoué : le moteur Edge TTS ne renvoie
          plus un flux audio valide en production.

          **Piste principale** : le schéma du jeton `Sec-MS-GEC` a changé (déjà
          arrivé une fois, v1 → v2). L'échec est silencieux côté service : il
          répond `HTTP 200` au handshake au lieu d'ouvrir le WebSocket, donc
          toute l'application devient muette sans erreur explicite.

          **À inspecter** :
          - `src/lib/tts/synthesizeEdgeTts.ts` — hôte et en-têtes du handshake
          - `src/lib/tts/edgeTtsToken.ts` — algorithme du jeton (vecteurs de test)

          Voir le détail du run dans l'onglet Actions de ce dépôt.

          _Issue ouverte automatiquement par un agent (OpenHands)._
          EOF

      - name: Ouvrir ou mettre à jour l'issue d'alerte
        if: steps.probe.outcome == 'failure' || env.SIMULATED_FAILURE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="TTS en production dégradé (sonde automatique)"
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            TITLE="[TEST] $TITLE"
          fi
          bash scripts/report-tts-health.sh --title "$TITLE" --body-file /tmp/tts-alert-body.md --label bug
